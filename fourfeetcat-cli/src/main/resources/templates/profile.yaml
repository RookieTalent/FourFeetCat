# Agent 配置：改完下一轮立即生效（每次组装 prompt 都现读，无缓存）
name: __NAME__
description: __DESCRIPTION__
identity:
  agent_name: 四脚猫
  prompt: 你是一个乐于助人的助手，回答简洁、直接。
provider:
  name: deepseek
  model: deepseek-v4-flash
tools: []
# 定时任务（可选）：到点自动跑一轮，不需要任何人发消息——这是第三种触发源（CLI / Web 之外的"钟推"）。
# 把下面这段取消注释，就给这个 Agent 加了一条定时任务；改完重启进程即生效，不必改代码、不必重新编译。
# schedules:
#   - id: daily-digest         # 可选：这条任务的稳定标识（进程内唯一）。不写则按 `Agent名#条目序号` 派生
#     cron: "0 0 9 * * *"      # 必填：6 段（秒 分 时 日 月 周）——每天 09:00。写成 5 段的 Unix 写法会被拒绝
#     zone: Asia/Shanghai      # 可选：时区。不写就按服务器时区跑，建议显式写，"早上 9 点"才对得上
#     message: 汇总昨天的进展    # 必填：到点发给 Agent 的那句话
# 几条口径：上一次没跑完时，下一次到点**直接跳过**（不排队、不堆积）；一条任务跑挂不影响其他任务；
# 同一任务的历次触发复用同一条会话（渠道与用户都固定为 scheduler，只为钟推服务，不与人推的对话混在一起）。
bootstrap:
  - AGENTS.md
  - SOUL.md
  - USER.md
settings:
  max_iterations: 10
  max_history_turns: 20
