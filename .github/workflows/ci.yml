name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:17 UTC 全量扫依赖 CVE（避开整点高峰）
    - cron: '17 3 * * 1'

jobs:
  verify:
    name: 构建 + 质量门禁（spotless / pmd / checkstyle / spotbugs / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ratchetFrom origin/main 依赖完整历史
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify

  dependency-check:
    name: OWASP Dependency-Check（依赖 CVE 全量扫描）
    runs-on: ubuntu-latest
    # 慢（NVD 限流），不挂 PR；仅 push main 与每周定时触发
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: mvn dependency-check
        run: mvn -B -ntp -Pdependency-check verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
