<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="'PingFang SC','Segoe UI',Arial,sans-serif">
  <!-- ═══ 圆耳蓝白猫脸：无尖角，软萌 ═══
       蓝圆耳（无尖）· 大白圆脸 · 大眼豆豆 · 粉鼻 · 粉腮 -->

  <!-- 蓝圆耳（先画，被白脸压住下半 → 只露两个圆顶） -->
  <circle cx="54" cy="74" r="30" fill="#7CA4E0"/>
  <circle cx="146" cy="74" r="30" fill="#7CA4E0"/>

  <!-- 大白圆脸 -->
  <circle cx="100" cy="132" r="60" fill="#FFFFFF" stroke="#2E56A8" stroke-width="5"/>

  <!-- 大眼 -->
  <circle cx="74" cy="148" r="10" fill="#20355E"/>
  <circle cx="126" cy="148" r="10" fill="#20355E"/>
  <circle cx="71" cy="144" r="3.4" fill="#FFFFFF"/>
  <circle cx="123" cy="144" r="3.4" fill="#FFFFFF"/>

  <!-- 粉鼻 -->
  <path d="M 90 164 Q 100 180 110 164 Z" fill="#F0A6B5"/>
  <!-- 嘴 -->
  <path d="M 100 178 Q 95 185 88 182 M 100 178 Q 105 185 112 182"
        stroke="#9AA7BD" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 粉腮 -->
  <circle cx="58" cy="170" r="8" fill="#FCD9DF"/>
  <circle cx="142" cy="170" r="8" fill="#FCD9DF"/>

  <!-- 胡须（淡，可远观） -->
  <path d="M 48 162 L 26 158 M 152 162 L 174 158"
        stroke="#A9C6EF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
