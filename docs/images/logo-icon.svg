<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="'PingFang SC','Segoe UI',Arial,sans-serif">
  <!-- ═══════ 简笔蓝白猫脸 ═══════
       白脸蓝边 · 蓝耳蓝额顶（蓝白双色）· 豆豆眼 · 粉鼻 · 胡须 -->
  <!-- 头（大圆白脸） -->
  <circle cx="100" cy="116" r="60" fill="#FFFFFF" stroke="#2E56A8" stroke-width="5.5"/>

  <!-- 耳（白芯蓝边） -->
  <path d="M 34 22 L 70 62 L 94 56 Z" fill="#FFFFFF" stroke="#2E56A8" stroke-width="5.5" stroke-linejoin="round"/>
  <path d="M 166 22 L 130 62 L 106 56 Z" fill="#FFFFFF" stroke="#2E56A8" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- 蓝白帽：额顶两耳之间的蓝罩 -->
  <path d="M 56 78
           A 60 60 0 0 1 144 78
           C 138 92 120 101 100 101
           C 80 101 62 92 56 78 Z"
        fill="#7CA4E0"/>

  <!-- 豆豆眼 -->
  <circle cx="74" cy="130" r="6.5" fill="#20355E"/>
  <circle cx="126" cy="130" r="6.5" fill="#20355E"/>
  <circle cx="72.2" cy="128" r="2" fill="#FFFFFF"/>
  <circle cx="124.2" cy="128" r="2" fill="#FFFFFF"/>

  <!-- 粉鼻 -->
  <path d="M 93 150 L 107 150 L 100 158 Z" fill="#F0A6B5" stroke="#F0A6B5" stroke-width="1" stroke-linejoin="round"/>

  <!-- 胡须 -->
  <path d="M 60 144 L 30 140 M 58 154 L 28 156
           M 140 144 L 170 140 M 142 154 L 172 156"
        stroke="#A9C6EF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
