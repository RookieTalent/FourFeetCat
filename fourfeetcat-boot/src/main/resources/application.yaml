spring:
  application:
    name: fourfeetcat
  # 宪法原则七：同步执行模型 + Java 21 虚拟线程处理并发
  threads:
    virtual:
      enabled: true
  # 持久化：SQLite 默认零配置；FOURFEETCAT_ROOT 环境变量可整体搬移工作区
  datasource:
    url: jdbc:sqlite:${FOURFEETCAT_ROOT:.fourfeetcat}/fourfeetcat.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者，单连接避免锁竞争
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 宪法：表结构只由 Flyway 迁移脚本管理
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration/sqlite

# 全局层（课件第16节）：声明本实例接了哪些 provider、凭证从哪个环境变量读；key 只走 ${ENV} 占位，不落明文。
# 缺省值为空串：零 key 可 boot（对齐 Docker entrypoint 口径）；真调用时由模型端报认证错误，不静默。
fourfeetcat:
  providers:
    - name: deepseek
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: fourfeetcat
