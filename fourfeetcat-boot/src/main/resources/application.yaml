spring:
  application:
    name: fourfeetcat
  # 宪法原则七：同步执行模型 + Java 21 虚拟线程处理并发
  threads:
    virtual:
      enabled: true
  # 持久化：SQLite 默认零配置；FOURFEETCAT_ROOT 环境变量可整体搬移工作区
  datasource:
    url: jdbc:sqlite:${FOURFEETCAT_ROOT:.fourfeetcat}/fourfeetcat.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者，单连接避免锁竞争
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 宪法：表结构只由 Flyway 迁移脚本管理
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration/sqlite

# 长期记忆后端（课件第22节可插拔）：markdown（默认，零依赖，工作区一个文件两区块）| sqlite（结构化，按条入库）
# | mem0（自托管外部记忆服务）。换档只改这一行，门面以上的代码一行不动——这是第21节那道"接口墙"的装配落点。
# 取值不是这三者时启动即拒并点名该取值，不静默回落。
memory:
  backend: markdown
  mem0:
    # 仅 backend=mem0 时使用；自托管实例、数据不出域。地址与作用域标识走环境变量，不落明文。
    base-url: ${MEM0_BASE_URL:}
    user-id: ${MEM0_USER_ID:fourfeetcat}

# 沙箱白名单（课件第24节）：涉外动作（读 / 写文件、跑命令、发请求）在校验通过之前根本不发生。
# 三块的共同口径：**留空 = 什么都不允许**，不是"不校验"——安全配置的默认姿态是关着门。
file:
  # 路径白名单：文件读、写、列目录都看这一份。每一项必须是**绝对路径**（相对路径按当前工作目录解析，
  # 而同一份配置在 CLI / 守护进程 / 容器三处的工作目录各不相同，故非绝对路径在启动时即被拒绝并点名该项）。
  # 默认取工作区根：Agent 开箱只能碰自己的东西。留空 = 一个文件都不许碰。
  allowed_paths: ${FOURFEETCAT_ROOT:${user.dir}/.fourfeetcat}
shell:
  # 命令白名单：按可执行文件名**精确比对**（大小写敏感，配什么写什么），只取命令首 token；参数不参与比对。
  # 把解释器（sh / bash / cmd）列进来，等于管理员显式授予本机代码执行权限，**不构成隔离**。
  # 留空 = 一条命令都不许跑。
  allowed_commands: []
http:
  # 域名白名单：**只比主机名**（端口与路径不参与比对、大小写敏感）。通配项 *.example.com 命中子域，
  # 不命中裸域 example.com，也不命中形似域名 evil-example.com。出站通知的 webhook 共用这一份，不另造一套。
  # 留空 = 一个域名都不许访问（数据不出域）。
  allowed_domains: []
# 说明：这一档是**劝阻级**防线——防模型犯傻与误操作，防不住蓄意攻击。核心阶段不建议用它跑完全不可信的
# 代码，也不建议对外做多租户；真要跑，按技术方案 §6.7 的信号升级到容器 / microVM 档（只新增实现类，接口与
# 调用方不改）。

# 全局层（课件第16节）：声明本实例接了哪些 provider、凭证从哪个环境变量读；key 只走 ${ENV} 占位，不落明文。
# 缺省值为空串：零 key 可 boot（对齐 Docker entrypoint 口径）；真调用时由模型端报认证错误，不静默。
fourfeetcat:
  providers:
    - name: deepseek
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
    # 免 key 验证全链路的 mock provider（第27节）：名字 "mock" 即装配 MockChatModel，不需要 key、不连真实模型。
    # 无 key 想跑通全链路/管理台时取消下面三行注释（或在新环境里加同样一段）：
    # - name: mock
    #   base-url: https://mock.invalid
    #   api-key:

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: fourfeetcat
